# Redis + serverless-redis-http for Dragon rate limiting
# Run on sandbox server. Main Dragon server connects via REDIS_URL=http://<sandbox-ip>:8079
services:
  redis:
    image: redis:7-alpine
    container_name: dragon_sandbox_redis
    volumes:
      - redis_data:/data
    restart: unless-stopped
  serverless-redis-http:
    image: hiett/serverless-redis-http:latest
    container_name: dragon_sandbox_redis_http
    ports:
      - "8079:80"
    environment:
      SRH_MODE: env
      SRH_TOKEN: ${REDIS_HTTP_TOKEN:-dragon_redis_sandbox_token}
      SRH_CONNECTION_STRING: "redis://redis:6379"
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  redis_data:
