# Data persistence: use bind mounts for host-path persistence.
# - Dev: .data/postgres and .data/redis (relative to compose file)
# - Production: set POSTGRES_DATA_PATH and REDIS_DATA_PATH (e.g. /opt/dragon/data/postgres)
services:
  postgres:
    image: postgres:16-alpine
    container_name: dragon_postgres_${ENV:-dev}
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dragon
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ${POSTGRES_DATA_PATH:-.data/postgres}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    container_name: dragon_redis_${ENV:-dev}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ${REDIS_DATA_PATH:-.data/redis}:/data
  serverless-redis-http:
    container_name: dragon_redis_http_${ENV:-dev}
    ports:
      - "${REDIS_HTTP_PORT:-8079}:80"
    image: hiett/serverless-redis-http:latest
    environment:
      SRH_MODE: env
      SRH_TOKEN: ${REDIS_HTTP_TOKEN:-redis_dev_token}
      SRH_CONNECTION_STRING: "redis://redis:6379"
