services:
  postgres:
    image: postgres:16-alpine
    container_name: dragon_postgres_${ENV:-dev}
    env_file:
      - .env.docker
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker and run with --env-file .env.docker}
      POSTGRES_DB: dragon
    ports:
      # Bind to loopback only so Postgres is not reachable from the public internet on a VPS.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    container_name: dragon_redis_${ENV:-dev}
    env_file:
      - .env.docker
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.docker and run with --env-file .env.docker}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
  serverless-redis-http:
    container_name: dragon_redis_http_${ENV:-dev}
    ports:
      - "127.0.0.1:${REDIS_HTTP_PORT:-8079}:80"
    image: hiett/serverless-redis-http:latest
    env_file:
      - .env.docker
    environment:
      SRH_MODE: env
      SRH_TOKEN: ${REDIS_HTTP_TOKEN:?Set REDIS_HTTP_TOKEN in .env.docker and run with --env-file .env.docker}
      SRH_CONNECTION_STRING: "redis://:${REDIS_PASSWORD}@redis:6379"
volumes:
  postgres_data:
  redis_data:
